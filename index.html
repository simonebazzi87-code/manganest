<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>MangaNest Pro 2026</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root{--main:#6c5ce7; --warn:#f1c40f; --danger:#e74c3c; --success:#27ae60; --blue:#3498db; --bg:#f5f6fa; --dark:#2d3436}
        body{margin:0;font-family:system-ui, -apple-system, sans-serif;background:var(--bg); color:var(--dark)}
        header{background:var(--main);color:#fff;padding:10px 15px;display:flex;justify-content:space-between;align-items:center}
        nav{display:flex;gap:8px;padding:10px;background:#fff;flex-wrap:wrap;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:100}
        nav button{height:40px;border:none;border-radius:6px;padding:0 12px;cursor:pointer;background:#eee;font-weight:bold;font-size:11px}
        nav button.active{background:var(--main);color:#fff}
        main{padding:12px; padding-bottom:100px}
        .card{background:#fff;padding:15px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.05);margin-bottom:12px}
        input, select, button.ok{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box;font-size:14px}
        button.ok{background:var(--main);color:#fff;border:none;font-weight:bold;cursor:pointer}
        button.danger{background:var(--danger);color:#fff;border:none;padding:5px 10px;border-radius:4px;cursor:pointer}
        .section-title{font-size:1.2rem;margin:10px 0;color:var(--main);text-transform:uppercase;font-weight:800}
        .row-edit{display:flex;gap:10px;align-items:center}
        .badge{font-size:9px;padding:2px 6px;border-radius:4px;color:#fff;font-weight:bold;display:inline-block}
        .bg-danger{background:var(--danger)}
        .bg-warn{background:var(--warn); color:var(--dark)}
        .vol-container{display:flex;flex-direction:column;align-items:center;gap:2px;width:55px}
        .volumeStatic{width:100%;height:32px;display:flex;justify-content:center;align-items:center;background:#f8f9fa;border:1px solid #ddd;border-radius:4px;font-weight:bold;font-size:13px;cursor:pointer}
        .tabs-fume{display:flex;gap:5px;margin-bottom:15px}
        .tab-f-btn{flex:1;padding:8px;border:none;border-radius:6px;font-size:10px;font-weight:bold;cursor:pointer;background:#ddd}
        .tab-f-btn.active{background:var(--dark);color:#fff}
        #uName{font-weight:bold;cursor:pointer}
    </style>
</head>
<body>
    <header>
        <span style="font-size:1.4rem;font-weight:900;letter-spacing:-1px">MangaNest</span>
        <span id="uName" onclick="selectUser()">Caricamento...</span>
    </header>
    <nav id="mainNav">
        <button onclick="showTab('home')" id="btn-home">COLLEZIONE</button>
        <button onclick="showTab('fumetteria')" id="btn-fumetteria">FUMETTERIA</button>
        <button onclick="showTab('stats')" id="btn-stats">STATS</button>
        <button onclick="showTab('users')" id="btn-users">PROFILI</button>
        <button onclick="showTab('backup')" id="btn-backup">BACKUP</button>
    </nav>
    <main id="app"></main>

    <script>
        // --- DATABASE INIZIALE ---
        let db = JSON.parse(localStorage.getItem('manganest_db')) || { 
            users: [], groups: [], series: [], volumes: [], outgoing: [], wishlist: [], currentUser: null 
        };
        const save = () => localStorage.setItem('manganest_db', JSON.stringify(db));
        let curTab = "home";
        let curFumTab = "da prendere";
        const app = document.getElementById("app");

        const getActiveGroup = () => {
            const u = db.users.find(x => x.id === db.currentUser);
            return u ? u.groupId : null;
        };

        // --- NAVIGAZIONE ---
        function showTab(t) {
            curTab = t;
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            const btn = document.getElementById(`btn-${t}`);
            if (btn) btn.classList.add('active');

            app.innerHTML = "";
            if (t === 'home') homeTab(app);
            else if (t === 'fumetteria') fumetteriaTab(app);
            else if (t === 'stats') statsTab(app);
            else if (t === 'users') usersTab(app);
            else if (t === 'backup') backupMenu(app);
        }

        function selectUser() {
            app.innerHTML = '<h2 class="section-title">Chi sei?</h2>';
            db.users.forEach(u => {
                const b = document.createElement("button");
                b.className = "ok";
                b.style.background = u.color;
                b.innerText = u.name;
                b.onclick = () => { db.currentUser = u.id; save(); render(); };
                app.appendChild(b);
            });
        }

        // --- SCHERMATA INIZIALE E AVVIO ---
        function render() {
            if (!db.users.length) {
                app.innerHTML = `
                    <div style="text-align:center; padding:50px 20px;">
                        <h1 style="color:var(--main); margin-bottom:10px;">Benvenuto su MangaNest</h1>
                        <p style="margin-bottom:30px; color:#666;">Come vuoi procedere?</p>
                        <div class="card" style="cursor:pointer; border:2px dashed var(--main); padding:30px;" onclick="document.getElementById('importFileInit').click()">
                            <b style="font-size:1.2rem; color:var(--main);">CARICA BACKUP (JSON)</b>
                            <p style="margin-top:5px; font-size:0.9rem;">Ripristina i tuoi dati salvati</p>
                            <input type="file" id="importFileInit" onchange="impDB(this)" style="display:none">
                        </div>
                        <div style="margin-top:20px;">
                            <button class="ok" style="background:#2d3436; padding:15px 30px;" onclick="initDefault()">INIZIA DA ZERO</button>
                        </div>
                    </div>`;
                return;
            }
            if (!db.currentUser) { selectUser(); return; }
            const u = db.users.find(x => x.id === db.currentUser);
            if (!u) { db.currentUser = null; selectUser(); return; }
            
            document.getElementById("uName").innerText = u.name;
            document.getElementById("uName").style.color = u.color;
            showTab(curTab);
        }

        function initDefault() {
            const gId = crypto.randomUUID();
            db.groups = [{id: gId, name: 'Miei Manga'}];
            db.users = [{id: crypto.randomUUID(), name: 'Simone', groupId: gId, color: '#6c5ce7'}];
            save(); render();
        }

    // --- HOME / COLLEZIONE ---
        function homeTab(c) {
            c.innerHTML = `
                <div class="card">
                    <input type="text" id="qS" placeholder="Cerca serie..." oninput="rH()">
                    <button class="ok" onclick="addSeriesMod()">+ NUOVA SERIE</button>
                </div>
                <div id="hList"></div>`;
            rH();
        }

        window.rH = () => {
            const q = document.getElementById("qS") ? document.getElementById("qS").value.toLowerCase() : "";
            const gid = getActiveGroup();
            let h = "";
            
            db.series.filter(s => s.groupId === gid && s.name.toLowerCase().includes(q))
            .sort((a,b) => a.name.localeCompare(b.name))
            .forEach(s => {
                const vs = db.volumes.filter(v => v.seriesId === s.id).map(v => v.number).sort((a,b)=>a-b);
                h += `
                <div class="card">
                    <div style="display:flex; gap:12px; margin-bottom:10px">
                        <img src="${s.img}" style="width:70px; height:100px; object-fit:cover; border-radius:6px; cursor:pointer" onclick="editS('${s.id}')">
                        <div style="flex:1">
                            <div style="display:flex; justify-content:space-between">
                                <b style="font-size:1.1rem">${s.name}</b>
                                <span class="badge" style="background:${s.status==='In Corso'?'var(--success)':'#999'}">${s.status}</span>
                            </div>
                            <div style="margin-top:8px">
                                <input type="number" id="v-${s.id}" placeholder="Num. vol" style="width:70px; padding:5px; margin:0">
                                <button class="ok" style="width:auto; padding:6px 12px; margin:0" onclick="addV('${s.id}')">AGGIUNGI</button>
                            </div>
                        </div>
                    </div>
                    <div style="display:flex; flex-wrap:wrap; gap:5px">
                        ${vs.map(n => `<button class="volumeStatic" onclick="delV('${s.id}', ${n})">${n}</button>`).join('')}
                    </div>
                </div>`;
            });
            document.getElementById("hList").innerHTML = h || '<p style="text-align:center; color:#999">Nessuna serie trovata.</p>';
        };

        // --- AZIONI SERIE E VOLUMI ---
        window.addSeriesMod = () => {
            const name = prompt("Nome Serie:");
            if(!name) return;
            const img = prompt("URL Immagine (opzionale):", "https://via.placeholder.com/150");
            const status = confirm("La serie è 'In Corso'? (OK = Sì, Cancel = Finita/Altro)") ? "In Corso" : "Finita";
            
            db.series.push({
                id: crypto.randomUUID(),
                name: name,
                img: img || "https://via.placeholder.com/150",
                status: status,
                groupId: getActiveGroup()
            });
            save(); rH();
        };

        window.editS = (id) => {
            const s = db.series.find(x => x.id === id);
            const nN = prompt("Nuovo nome:", s.name);
            const nI = prompt("Nuovo URL immagine:", s.img);
            const nS = prompt("Stato (In Corso / Finita / Da Iniziare):", s.status);
            if(nN) s.name = nN;
            if(nI) s.img = nI;
            if(nS) s.status = nS;
            if(confirm("Eliminare intera serie?")) {
                db.series = db.series.filter(x => x.id !== id);
                db.volumes = db.volumes.filter(v => v.seriesId !== id);
                db.outgoing = db.outgoing.filter(o => o.seriesId !== id);
            }
            save(); rH();
        };

        window.addV = (sid) => {
            const n = parseInt(document.getElementById(`v-${sid}`).value);
            if(!n) return;
            if(!db.volumes.some(v => v.seriesId === sid && v.number === n)) {
                db.volumes.push({ seriesId: sid, number: n });
                save(); rH();
            }
            document.getElementById(`v-${sid}`).value = "";
        };

        window.delV = (sid, n) => {
            if(confirm(`Eliminare volume ${n}?`)) {
                db.volumes = db.volumes.filter(v => !(v.seriesId === sid && v.number === n));
                save(); rH();
            }
        };

     // --- SEZIONE FUMETTERIA ---
        function fumetteriaTab(c) {
            c.innerHTML = `
                <h2 class="section-title">FUMETTERIA</h2>
                <div class="tabs-fume">
                    ${["tutto", "da prendere", "mancanti", "da iniziare"].map(t => `
                        <button class="tab-f-btn ${curFumTab === t ? 'active' : ''}" onclick="setFumTab('${t}')">
                            ${t.toUpperCase()}
                        </button>
                    `).join('')}
                </div>
                <div id="fList"></div>`;
            rFum();
        }

        window.setFumTab = (t) => { curFumTab = t; fumetteriaTab(app); };

        window.rFum = () => {
            const gid = getActiveGroup();
            let h = "";
            
            if (curFumTab === "da iniziare") {
                const sDaI = db.series.filter(s => s.groupId === gid && s.status === "Da Iniziare");
                h = `
                <div class="card" style="background:#e3f2fd; border-left:5px solid var(--blue)">
                    <b>SERIE DA INIZIARE:</b><br>
                    ${sDaI.length ? sDaI.map(s=>`• ${s.name}`).join('<br>') : 'Nessuna serie con stato "Da Iniziare".'}
                </div>
                <div class="card">
                    <h3>Wishlist (Appunti)</h3>
                    <input id="wiT" placeholder="Titolo">
                    <input id="wiV" type="number" placeholder="Volumi">
                    <button class="ok" onclick="addWi()">AGGIUNGI</button>
                </div>`;
                
                db.wishlist.filter(w => w.groupId === gid).forEach(w => {
                    h += `
                    <div class="card" style="display:flex; justify-content:space-between; align-items:center">
                        <span><b>${w.title}</b> (${w.vols} vol)</span>
                        <button class="danger" onclick="delWi('${w.id}')">X</button>
                    </div>`;
                });
            } else {
                db.series.filter(s => s.groupId === gid && s.status !== "Da Iniziare")
                .sort((a,b)=>a.name.localeCompare(b.name))
                .forEach(sr => {
                    const vs = db.volumes.filter(v => v.seriesId === sr.id).map(v => v.number), maxP = vs.length ? Math.max(...vs) : 0;
                    const gaps = []; for (let i = 1; i < maxP; i++) if (!vs.includes(i)) gaps.push(i);
                    const inL = db.outgoing.filter(o => o.seriesId === sr.id).map(o => o.number).sort((a,b)=>a-b);
                    
                    const maxL = inL.length ? Math.max(...inL) : 0;
                    const nextN = Math.max(maxP, maxL) + 1;

                    let show = (curFumTab === "tutto") || 
                               (curFumTab === "da prendere" && (inL.length > 0 || gaps.length > 0)) || 
                               (curFumTab === "mancanti" && gaps.length > 0);
                    
                    if (show) { 
                        h += `
                        <div class="card">
                            <div class="row-edit">
                                <img src="${sr.img}" style="width:60px; height:60px; object-fit:cover; border-radius:4px">
                                <div style="flex:1">
                                    <b>${sr.name}</b>
                                    <div style="display:flex; flex-wrap:wrap; margin-top:5px; gap:4px">
                                        ${gaps.map(n => `<div class="vol-container"><span class="badge bg-danger">MANCANTE</span><span class="volumeStatic">${n}</span></div>`).join('')}
                                        ${inL.map(n => `<div class="vol-container"><span class="badge bg-warn">DA PRENDERE</span><button class="volumeStatic" style="border:1.5px solid var(--warn)" onclick="tglOut('${sr.id}', ${n})">${n} ✕</button></div>`).join('')}
                                        ${(sr.status === 'In Corso') ? `<div class="vol-container"><span class="badge" style="background:#ccc">NEXT</span><button class="ok" style="width:100%; height:32px; padding:0" onclick="tglOut('${sr.id}', ${nextN})">${nextN} +</button></div>` : ''}
                                    </div>
                                </div>
                            </div>
                        </div>`; 
                    }
                });
            }
            document.getElementById("fList").innerHTML = h || '<p style="text-align:center; color:#999; margin-top:20px">Nessun volume trovato.</p>';
        };

        window.addWi = () => { 
            const t = document.getElementById("wiT").value; 
            if(t) { 
                db.wishlist.push({ id: crypto.randomUUID(), title: t, vols: document.getElementById("wiV").value, groupId: getActiveGroup() }); 
                save(); rFum(); 
            }
        };
        window.delWi = (id) => { db.wishlist = db.wishlist.filter(x => x.id !== id); save(); rFum(); };
        window.tglOut = (sid, n) => { 
            const idx = db.outgoing.findIndex(o => o.seriesId === sid && o.number === n); 
            if (idx > -1) db.outgoing.splice(idx, 1); 
            else db.outgoing.push({ seriesId: sid, number: n }); 
            save(); rFum(); 
        };

   // --- STATISTICHE ---
        function statsTab(c) {
            const gid = getActiveGroup();
            const sUser = db.series.filter(s => s.groupId === gid);
            const vUser = db.volumes.filter(v => sUser.some(s => s.id === v.seriesId));
            
            c.innerHTML = `
                <h2 class="section-title">Statistiche</h2>
                <div class="card" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; text-align:center">
                    <div><b style="font-size:1.5rem; color:var(--main)">${sUser.length}</b><br><small>Serie</small></div>
                    <div><b style="font-size:1.5rem; color:var(--success)">${vUser.length}</b><br><small>Volumi</small></div>
                </div>
                <h3 style="margin-left:5px">Dettaglio Serie</h3>
                <div id="statsList"></div>`;
            
            sUser.sort((a,b) => a.name.localeCompare(b.name)).forEach(s => {
                const count = db.volumes.filter(v => v.seriesId === s.id).length;
                document.getElementById("statsList").innerHTML += `
                    <div class="card" style="display:flex; justify-content:space-between; padding:10px 15px">
                        <span>${s.name}</span>
                        <b>${count} vol.</b>
                    </div>`;
            });
        }

        // --- GESTIONE UTENTI E GRUPPI ---
        function usersTab(c) {
            c.innerHTML = `
                <h2 class="section-title">GRUPPI (Famiglie)</h2>
                <div id="gL"></div>
                <div class="card">
                    <input id="gn" placeholder="Nome nuovo gruppo">
                    <button class="ok" onclick="cG()">CREA GRUPPO</button>
                </div>
                <h2 class="section-title">PROFILI UTENTE</h2>
                <div id="uList"></div>
                <div class="card">
                    <h3>Nuovo Profilo</h3>
                    <input id="un" placeholder="Nome">
                    <select id="ug">${db.groups.map(g => `<option value="${g.id}">${g.name}</option>`).join('')}</select>
                    <input type="color" id="uc" value="#6c5ce7" style="height:50px">
                    <button class="ok" onclick="cU()">AGGIUNGI UTENTE</button>
                </div>`;
            
            db.groups.forEach(g => {
                document.getElementById("gL").innerHTML += `
                    <div class="card" style="display:flex; justify-content:space-between; align-items:center">
                        <b>${g.name}</b>
                        ${g.id !== 'default' ? `<button class="danger" onclick="dG('${g.id}')">Elimina</button>` : '<i>Principale</i>'}
                    </div>`;
            });
            
            db.users.forEach(u => {
                const gName = db.groups.find(g => g.id === u.groupId)?.name || 'Nessuno';
                document.getElementById("uList").innerHTML += `
                    <div class="card">
                        <div style="display:flex; justify-content:space-between; align-items:center">
                            <b style="color:${u.color}">${u.name}</b>
                            <small>Gruppo: ${gName}</small>
                        </div>
                        <button class="danger" style="margin-top:10px; width:100%" onclick="dU('${u.id}')">ELIMINA PROFILO</button>
                    </div>`;
            });
        }

        window.cG = () => { const n = document.getElementById("gn").value.trim(); if(n){ db.groups.push({id:crypto.randomUUID(), name:n}); save(); usersTab(app); }};
        window.cU = () => { const n = document.getElementById("un").value.trim(); if(n){ db.users.push({id:crypto.randomUUID(), name:n, groupId:document.getElementById("ug").value, color:document.getElementById("uc").value}); save(); usersTab(app); }};
        window.dG = (id) => { if(confirm("Eliminare il gruppo? Le serie rimarranno ma non avranno più un gruppo.")){ db.groups = db.groups.filter(x => x.id !== id); save(); usersTab(app); }};
        window.dU = (id) => { if(db.users.length > 1 && confirm("Eliminare questo utente?")){ db.users = db.users.filter(x => x.id !== id); if(db.currentUser === id) db.currentUser = null; save(); render(); }};

        // --- BACKUP ---
        function backupMenu(c) { 
            c.innerHTML = `
                <h2 class="section-title">BACKUP E DATI</h2>
                <div class="card">
                    <p>Scarica una copia dei tuoi dati per sicurezza o per usarla su un altro dispositivo.</p>
                    <button class="ok" style="width:100%" onclick="exDB()">ESPORTA JSON</button>
                </div>
                <div class="card">
                    <p>Carica un file backup precedentemente salvato.</p>
                    <input type="file" id="importFile" onchange="impDB(this)" style="display:none">
                    <button class="ok" style="width:100%; background:#2d3436" onclick="document.getElementById('importFile').click()">IMPORTA JSON</button>
                </div>`; 
        }
        
        window.exDB = () => { 
            const blob = new Blob([JSON.stringify(db)], {type: "application/json"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = "manganest_backup.json"; a.click(); 
        };
        
        window.impDB = (i) => { 
            const r = new FileReader(); 
            r.onload = (e) => { 
                try { 
                    const data = JSON.parse(e.target.result); 
                    if(data.users && data.series) { db = data; save(); location.reload(); }
                    else { alert("File non valido!"); }
                } catch(err) { alert("Errore nel caricamento!"); }
            }; 
            r.readAsText(i.files[0]); 
        };

        // AVVIO FINALE
        render();
    </script>
</body>
</html>
